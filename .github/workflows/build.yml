name: Build APK

# Trois façons de lancer un build, toutes utilisables depuis un téléphone :
#  - push sur n'importe quelle branche (donc à chaque modification envoyée) ;
#  - ouverture / mise à jour d'une pull request ;
#  - déclenchement manuel : onglet Actions > Build APK > Run workflow.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: "Construire aussi un APK release (non signé si aucun secret n'est configuré)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versions figées : deux builds successifs produisent la même chose.
  JAVA_VERSION: "17"
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"

jobs:
  debug-apk:
    name: Tests + APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer le JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Installer les composants Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Configurer Gradle (avec cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Rendre le wrapper Gradle exécutable
        run: chmod +x ./gradlew

      - name: Vérifier le wrapper Gradle
        run: ./gradlew --version

      - name: Tests unitaires
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Publier les rapports de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Compiler l'APK debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Préparer l'APK à télécharger
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/FileDrop-debug-${GITHUB_SHA::7}.apk"
          ls -lh artifacts

      # C'est cet artifact qu'il faut télécharger depuis le téléphone :
      # Actions > le run > section « Artifacts » > filedrop-apk-debug.
      - name: Publier l'APK debug dans les artifacts
        uses: actions/upload-artifact@v4
        with:
          name: filedrop-apk-debug
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Résumé du build
        if: always()
        run: |
          {
            echo "## FileDrop — APK debug"
            echo ""
            echo "| Élément | Valeur |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Branche | \`${GITHUB_REF_NAME}\` |"
            echo "| Artifact | \`filedrop-apk-debug\` |"
            echo ""
            echo "Télécharger l'artifact, décompresser le .zip, puis installer le .apk."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # APK release : volontairement hors du chemin critique de la V1.
  # Ne s'exécute que sur déclenchement manuel avec build_release = true.
  # Sans secrets de signature, l'APK produit est NON SIGNÉ et non installable ;
  # il sert uniquement à vérifier que la variante release compile.
  # Pour l'activer réellement, voir le README (section « APK release signé »).
  # ---------------------------------------------------------------------------
  release-apk:
    name: APK release (facultatif)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && inputs.build_release

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer le JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Installer les composants Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Configurer Gradle (avec cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Rendre le wrapper Gradle exécutable
        run: chmod +x ./gradlew

      - name: Restaurer le keystore (si le secret existe)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FILEDROP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/filedrop.jks"
            echo "path=$RUNNER_TEMP/filedrop.jks" >> "$GITHUB_OUTPUT"
            echo "Keystore restauré."
          else
            echo "Aucun keystore configuré : l'APK release sera NON SIGNÉ."
          fi

      - name: Compiler l'APK release
        env:
          FILEDROP_KEYSTORE: ${{ steps.keystore.outputs.path }}
          FILEDROP_KEYSTORE_PASSWORD: ${{ secrets.FILEDROP_KEYSTORE_PASSWORD }}
          FILEDROP_KEY_ALIAS: ${{ secrets.FILEDROP_KEY_ALIAS }}
          FILEDROP_KEY_PASSWORD: ${{ secrets.FILEDROP_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Publier l'APK release dans les artifacts
        uses: actions/upload-artifact@v4
        with:
          name: filedrop-apk-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
