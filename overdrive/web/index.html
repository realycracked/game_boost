  <title>Overdrive</title>
  <script>
    /* Applique thème, niveau d'animation et langue depuis localStorage AVANT le
       premier rendu (aucun flash). Thèmes : midnight (défaut), midnight-ocean,
       midnight-emerald, midnight-rose, daylight ; anciennes valeurs reprises :
       dark → midnight, light → daylight. Animation : max (défaut) | reduced | off ;
       sans choix enregistré, prefers-reduced-motion donne « reduced ». */
    (function () {
      var d = document.documentElement;
      var themes = ["midnight", "midnight-ocean", "midnight-emerald", "midnight-rose", "daylight"];
      var t = "midnight";
      try {
        var s = localStorage.getItem("overdrive-theme");
        if (s === "dark") { s = "midnight"; } else if (s === "light") { s = "daylight"; }
        if (themes.indexOf(s) !== -1) { t = s; }
      } catch (e) { /* stockage indisponible : Midnight par défaut */ }
      d.setAttribute("data-theme", t);
      var m = null;
      try { m = localStorage.getItem("overdrive-motion"); } catch (e1) { m = null; }
      if (m !== "max" && m !== "reduced" && m !== "off") {
        m = "max";
        try {
          if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) { m = "reduced"; }
        } catch (e2) { /* média indisponible : max */ }
      }
      d.setAttribute("data-motion", m);
      try {
        var l = localStorage.getItem("overdrive-lang");
        if (l === "fr" || l === "en") { d.lang = l; }
      } catch (e3) { /* langue par défaut : fr */ }
    })();
  </script>
