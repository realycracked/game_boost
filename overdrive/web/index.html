<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overdrive</title>
  <script>
    /* Applique le thème depuis localStorage AVANT le premier rendu (aucun flash). */
    (function () {
      var t = "light";
      try {
        var s = localStorage.getItem("overdrive-theme");
        if (s === "dark" || s === "light") { t = s; }
      } catch (e) { /* stockage indisponible : thème clair par défaut */ }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
